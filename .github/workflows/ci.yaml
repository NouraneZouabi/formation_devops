name: integration contenu spring angular avec github action

on:
  push: 
    branches: main 

jobs: 
  build_and_push: 
    runs-on: ubuntu-latest

    steps: 
    - name: checkout code 
      uses: actions/checkout@v7

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: build de la partie frontend
      run : | 
        docker build -t nouran10/angular-app angular-app
        docker push nouran10/angular-app 